# VictoriaMetrics single-node configuration for GroveOS sensor telemetry.
#
# Raw 1-second sensor data is retained for 14 days.  A recording rule
# (or external vmagent) should downsample to 1-minute resolution for
# long-term storage (retained indefinitely via a separate -retentionPeriod
# on the downsampled namespace).  The raw retention here is set to 14d.
#
# Designed for Jetson-class hardware: memory is capped at 512 MB.

# ── Storage ────────────────────────────────────────────────────────────
-storageDataPath=/var/lib/grove/tsdb

# ── Retention ──────────────────────────────────────────────────────────
# Raw 1-second data: 14 days
-retentionPeriod=14d

# Downsampled 1-minute data lives forever (separate tenant / namespace).
# Configure via -downsampling.period=1m:0s  (keep all 1m data forever)
-downsampling.period=1m:0s

# ── Network ────────────────────────────────────────────────────────────
-httpListenAddr=127.0.0.1:8428

# ── Resource limits (Jetson-appropriate) ───────────────────────────────
-memory.allowedPercent=0
-memory.allowedBytes=536870912

# ── Misc ───────────────────────────────────────────────────────────────
-search.maxUniqueTimeseries=50000
-search.maxSamplesPerSeries=30000000
